<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>幻梦 · 茂密 Bot 日志控制台</title>
<style>
:root{
 --bg:#0d0d1a; --panel:#12122a; --panel2:#171735; --border:#1e1e3a;
 --text:#e5e7eb; --muted:#6b7280; --soft:#9ca3af;
 --time:#6b7280; --debug:#7dd3fc; --info:#c4b5fd; --warn:#fb923c; --error:#ef4444;
 --source:#9ca3af; --symbol:#f9a8d4; --module:#4ade80; --num:#fde047;
 --highlight:#67e8f9; --admin:#f472b6; --sep:#a78bfa; --ok:#22c55e;
 --rainbow:linear-gradient(90deg,#ff5f6d,#ffb147,#ffe259,#3ddc84,#38bdf8,#8b7bff,#e879f9,#ff5f6d);
 --fd:'Chakra Petch','Noto Sans SC',sans-serif;
 --fb:'Noto Sans SC',system-ui,sans-serif;
 --fm:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:13px;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:34px 34px;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(600px 220px at 18% 0%,rgba(255,95,109,.07),transparent 70%),radial-gradient(600px 240px at 55% 0%,rgba(56,189,248,.06),transparent 70%),radial-gradient(520px 220px at 88% 0%,rgba(232,121,249,.06),transparent 70%);}
header,main,footer{position:relative;z-index:1}
::selection{background:rgba(139,123,255,.45)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#26264a;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#3a3a6a}
button{font-family:inherit;color:inherit}
.rainbow-line{height:3px;flex:none;background:var(--rainbow);background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:12px;padding:2px;background:var(--rainbow);background-size:200% 100%;animation:flow 6s linear infinite;box-shadow:0 4px 18px rgba(139,123,255,.35)}
.logo-in{width:100%;height:100%;border-radius:10px;background:#101024;display:grid;place-items:center;font-family:var(--fd);font-weight:700;color:#fff;font-size:15px}
.brand h1{font-family:var(--fd);font-size:17px;font-weight:700;letter-spacing:.5px;line-height:1.15}
.brand h1 em{font-style:normal;color:var(--highlight)}
.brand .sub{font-size:10px;color:var(--muted);letter-spacing:2.5px;margin-top:2px}
.conn{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12px;transition:border-color .3s}
.conn.live{border-color:rgba(34,197,94,.45)}
.conn.warn{border-color:rgba(251,146,60,.5)}
.conn.err{border-color:rgba(239,68,68,.55)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);position:relative}
.dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent}
.live .dot{background:var(--ok)} .live .dot::after{border-color:rgba(34,197,94,.5);animation:ping 1.6s ease-out infinite}
.warn .dot{background:var(--warn);animation:blink 1s infinite}
.err .dot{background:var(--error);animation:blink .6s infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes blink{50%{opacity:.25}}
.clock{font-family:var(--fm);font-size:12px;color:var(--soft);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:6px 11px;letter-spacing:1px}
.spacer{flex:1}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lv{display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--fm);font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--soft);transition:.2s;user-select:none}
.lv:hover{transform:translateY(-1px);background:rgba(255,255,255,.05)}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.lv b{font-weight:500;opacity:.75}
.lv.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.lv.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.lv[data-lv="INFO"]{--c:var(--info)} .lv[data-lv="DEBUG"]{--c:var(--debug)}
.lv[data-lv="WARNING"]{--c:var(--warn)} .lv[data-lv="ERROR"]{--c:var(--error)}
.search{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;transition:.2s}
.search:focus-within{border-color:var(--module);box-shadow:0 0 0 3px rgba(74,222,128,.12)}
.search input{background:none;border:none;outline:none;color:var(--text);font-size:12px;width:150px;font-family:var(--fm)}
.search input::placeholder{color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;transition:.2s}
.tbtn:hover{border-color:var(--highlight);transform:translateY(-1px)}
.tbtn.active{border-color:var(--module);color:var(--module)}
.fontctl{display:flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:3px 6px}
.fontctl button{background:none;border:none;cursor:pointer;color:var(--soft);font-family:var(--fd);font-size:13px;padding:2px 6px;border-radius:6px}
.fontctl button:hover{background:rgba(255,255,255,.06);color:var(--text)}
/* 概览卡片 */
.overview{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap;flex:none}
.oc{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.oc .lab{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.oc .val{font-family:var(--fd);font-size:24px;font-weight:700}
.oc .val.ok{color:var(--ok)} .oc .val.warn{color:var(--warn)} .oc .val.err{color:var(--error)}
.oc .sub{font-size:11px;color:var(--soft)}
/* 日志区 */
main{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 16px 12px}
.logwrap{flex:1;min-height:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:auto;position:relative}
.loghdr{position:sticky;top:0;background:linear-gradient(var(--panel),rgba(18,18,42,.92));backdrop-filter:blur(4px);padding:8px 14px;font-size:11px;color:var(--muted);display:flex;gap:14px;border-bottom:1px solid var(--border);z-index:2}
.loglist{padding:6px 0;font-family:var(--fm);font-size:12px;line-height:1.7}
.row{display:flex;gap:10px;padding:2px 14px;border-left:3px solid transparent;white-space:pre-wrap;word-break:break-word}
.row:hover{background:rgba(255,255,255,.03)}
.row .t{color:var(--time);flex:none}
.row .lvtag{flex:none;width:62px;text-align:center;border-radius:5px;font-size:10px;padding:1px 0;align-self:flex-start;margin-top:2px}
.row.DEBUG .lvtag{background:rgba(125,211,252,.15);color:var(--debug)} .row.DEBUG{border-left-color:var(--debug)}
.row.INFO .lvtag{background:rgba(196,181,253,.15);color:var(--info)} .row.INFO{border-left-color:var(--info)}
.row.WARNING .lvtag{background:rgba(251,146,60,.15);color:var(--warn)} .row.WARNING{border-left-color:var(--warn)}
.row.ERROR .lvtag{background:rgba(239,68,68,.15);color:var(--error)} .row.ERROR{border-left-color:var(--error)}
.row .src{color:var(--source);flex:none}
.row .msg{color:var(--text)}
.row .msg .pl{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px;font-family:var(--fb)}
footer{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--border);background:var(--panel);font-size:11px;color:var(--muted);flex-wrap:wrap}
footer .ws{font-family:var(--fm)}
footer .grow{flex:1}
.tagsel{display:flex;gap:5px;flex-wrap:wrap}
.tagsel .tg{cursor:pointer;font-family:var(--fm);font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--soft);user-select:none}
.tagsel .tg.on{color:var(--text);border-color:var(--highlight);background:rgba(103,232,249,.1)}
.toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:8px 16px;border-radius:10px;font-size:12px;opacity:0;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="rainbow-line"></div>
<header>
  <div class="brand">
    <div class="logo"><div class="logo-in">茂</div></div>
    <div>
      <h1>幻梦 <em>茂密 Bot</em> 日志控制台</h1>
      <div class="sub">REALTIME · WSS LOG VIEWER</div>
    </div>
  </div>
  <div class="conn" id="conn"><span class="dot"></span><span id="connText">连接中…</span></div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="spacer"></div>
  <div class="filters">
    <div class="lv on" data-lv="DEBUG"><i></i>DEBUG<b id="cDEBUG">0</b></div>
    <div class="lv on" data-lv="INFO"><i></i>INFO<b id="cINFO">0</b></div>
    <div class="lv on" data-lv="WARNING"><i></i>WARN<b id="cWARNING">0</b></div>
    <div class="lv on" data-lv="ERROR"><i></i>ERROR<b id="cERROR">0</b></div>
  </div>
  <div class="search"><span>🔍</span><input id="search" placeholder="搜索日志…" /></div>
  <div class="tools">
    <div class="tbtn" id="btnFollow">跟随</div>
    <div class="tbtn" id="btnClear">清空</div>
    <div class="tbtn" id="btnCopy">复制</div>
    <div class="tbtn" id="btnExport">导出</div>
    <div class="fontctl"><button id="fDec">A-</button><button id="fInc">A+</button></div>
  </div>
</header>

<div class="overview">
  <div class="oc"><div class="lab">总日志</div><div class="val" id="ovTotal">0</div><div class="sub" id="ovRate">0 条/分</div></div>
  <div class="oc"><div class="lab">警告</div><div class="val warn" id="ovWarn">0</div><div class="sub">WARNING 计数</div></div>
  <div class="oc"><div class="lab">错误</div><div class="val err" id="ovErr">0</div><div class="sub">ERROR 计数</div></div>
  <div class="oc"><div class="lab">数据源</div><div class="val ok" style="font-size:15px" id="ovSrc">WSS</div><div class="sub">01240820.xyz:20030</div></div>
</div>

<main>
  <div class="logwrap" id="logwrap">
    <div class="loghdr">
      <span>时间</span><span>级别</span><span>来源</span><span>消息</span>
      <span class="grow" style="flex:1"></span>
      <span id="hdrBuf">缓冲 0 / 500</span>
    </div>
    <div class="loglist" id="loglist"><div class="empty">正在连接日志服务…</div></div>
  </div>
</main>

<footer>
  <span class="ws" id="wsStat">WS 轮询</span>
  <span id="footStat">0 条 可见 0 缓冲 0</span>
  <div class="grow"></div>
  <span>来源筛选：</span>
  <div class="tagsel" id="tagsel"></div>
</footer>
<div class="toast" id="toast"></div>

<script>
// ════════ 配置（Token 写死，仅自己可见部署） ════════
const WSS_API = "http://01240820.xyz:20030/v1/wss/log";
const WSS_TOKEN = "wss-5e676f758d871fee8d598655397bbc2783f27dee70501864";
const POLL_MS = 4000;       // 轮询间隔
const MAX_BUF = 500;        // 缓冲上限
const FETCH_LIMIT = 200;    // 每次拉取条数

// ════════ 状态 ════════
let logs = [];              // {id,source,device,level,message,payload,timestamp}
let seen = new Set();       // 已展示 id
let levelOn = {DEBUG:true,INFO:true,WARNING:true,ERROR:true};
let sources = {};           // source -> on
let searchKw = "";
let follow = true;
let fontSize = 12;
let lastTs = 0;             // 增量拉取用
let rateWindow = [];        // 时间戳数组，算吞吐

// ════════ DOM ════════
const $ = s=>document.querySelector(s);
const loglist = $("#loglist");
const logwrap = $("#logwrap");
const toast = $("#toast");
function showToast(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800);}

// 时钟
setInterval(()=>{const d=new Date();$("#clock").textContent=d.toTimeString().slice(0,8);},1000);

// ════════ 拉取 ════════
async function poll(){
  try{
    let url = `${WSS_API}?limit=${FETCH_LIMIT}`;
    if(lastTs) url += `&since=${lastTs}`;
    const r = await fetch(url,{headers:{Authorization:"Bearer "+WSS_TOKEN}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    if(!j.ok) throw new Error(j.message||"接口返回 false");
    const arr = (j.data||[]);
    if(arr.length){
      // 倒序（最新的在前面）展示
      for(const it of arr){
        if(seen.has(it.id)) continue;
        seen.add(it.id);
        logs.push(it);
        rateWindow.push(it.timestamp);
        if(it.timestamp>lastTs) lastTs = it.timestamp;
      }
      // 截断缓冲
      if(logs.length>MAX_BUF){ logs = logs.slice(logs.length-MAX_BUF); }
      setConn("live","已连接");
      $("#wsStat").textContent = "WS 轮询 · 正常";
      render();
    } else {
      setConn("live","已连接");
      $("#wsStat").textContent = "WS 轮询 · 无新日志";
    }
  }catch(e){
    setConn("err","断开");
    $("#wsStat").textContent = "WS 轮询 · 错误: "+e.message;
  }
}
function setConn(cls,txt){const c=$("#conn");c.className="conn "+cls;$("#connText").textContent=txt;}

// ════════ 渲染 ════════
function fmtTime(ts){
  const d=new Date((ts||0)*1000);
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function render(){
  // 统计
  let c={DEBUG:0,INFO:0,WARNING:0,ERROR:0};
  let srcSet={};
  for(const it of logs){
    c[it.level]=(c[it.level]||0)+1;
    srcSet[it.source]=(srcSet[it.source]||0)+1;
  }
  $("#cDEBUG").textContent=c.DEBUG;$("#cINFO").textContent=c.INFO;
  $("#cWARNING").textContent=c.WARNING;$("#cERROR").textContent=c.ERROR;
  $("#ovTotal").textContent=logs.length;
  $("#ovWarn").textContent=c.WARNING;$("#ovErr").textContent=c.ERROR;
  // 吞吐（近 60s）
  const now=Date.now()/1000;
  rateWindow = rateWindow.filter(t=>now-t<60);
  $("#ovRate").textContent = rateWindow.length+" 条/分";
  // 来源标签
  renderTags(srcSet);
  // 过滤
  const vis = logs.filter(it=>
    levelOn[it.level] && (sources[it.source]!==false) &&
    (!searchKw || (it.message+" "+(it.source||"")+" "+(it.device||"")).toLowerCase().includes(searchKw))
  );
  $("#hdrBuf").textContent = `缓冲 ${logs.length} / ${MAX_BUF}`;
  $("#footStat").textContent = `${vis.length} 条 可见 ${vis.length} 缓冲 ${logs.length}`;
  if(!vis.length){
    loglist.innerHTML = `<div class="empty">暂无符合条件的日志</div>`;
    return;
  }
  // 渲染（最新在上）
  const html = vis.slice().reverse().map(it=>{
    const pl = it.payload? ` <span class="pl">${esc(JSON.stringify(it.payload))}</span>`:"";
    const dev = it.device? `<span class="src">[${esc(it.device)}]</span> `:"";
    return `<div class="row ${it.level}"><span class="t">${fmtTime(it.timestamp)}</span>`
      +`<span class="lvtag">${it.level}</span>`
      +`<span class="src">${esc(it.source)}</span>`
      +`<span class="msg">${dev}${esc(it.message)}${pl}</span></div>`;
  }).join("");
  loglist.innerHTML = html;
  if(follow) logwrap.scrollTop = 0;
}
function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}

function renderTags(srcSet){
  const box=$("#tagsel");
  const keys=Object.keys(srcSet).sort();
  let html="";
  for(const k of keys){
    const on = sources[k]!==false;
    html+=`<div class="tg ${on?'on':''}" data-src="${esc(k)}">${esc(k)} ${srcSet[k]}</div>`;
  }
  box.innerHTML=html;
  box.querySelectorAll(".tg").forEach(el=>{
    el.onclick=()=>{const s=el.dataset.src;sources[s]=sources[s]===false;render();};
  });
}

// ════════ 交互 ════════
document.querySelectorAll(".lv").forEach(el=>{
  el.onclick=()=>{const lv=el.dataset.lv;levelOn[lv]=!levelOn[lv];el.classList.toggle("on",levelOn[lv]);render();};
});
$("#search").oninput=e=>{searchKw=e.target.value.toLowerCase().trim();render();};
$("#btnFollow").onclick=()=>{follow=!follow;$("#btnFollow").classList.toggle("active",follow);if(follow)logwrap.scrollTop=0;showToast(follow?"已开启跟随":"已暂停跟随");};
$("#btnClear").onclick=()=>{logs=[];seen.clear();rateWindow=[];render();showToast("已清空缓冲");};
$("#btnCopy").onclick=()=>{
  const txt=logs.slice().reverse().map(it=>`${fmtTime(it.timestamp)} [${it.level}] ${it.source} ${it.message}`).join("\n");
  navigator.clipboard.writeText(txt).then(()=>showToast("已复制 "+logs.length+" 条"),()=>showToast("复制失败"));
};
$("#btnExport").onclick=()=>{
  const txt=logs.slice().reverse().map(it=>JSON.stringify(it)).join("\n");
  const blob=new Blob([txt],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bot_logs_"+Date.now()+".jsonl";a.click();
  showToast("已导出日志文件");
};
$("#fInc").onclick=()=>{fontSize=Math.min(20,fontSize+1);loglist.style.fontSize=fontSize+"px";};
$("#fDec").onclick=()=>{fontSize=Math.max(10,fontSize-1);loglist.style.fontSize=fontSize+"px";};
logwrap.onscroll=()=>{if(logwrap.scrollTop>40&&follow){follow=false;$("#btnFollow").classList.remove("active");}};

// ════════ 启动 ════════
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
