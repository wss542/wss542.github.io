<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yzandwss 的主页</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2, #6B8DD6, #8E37D7);
    background-size: 400% 400%;
    animation: flow 15s ease infinite;
    min-height: 100vh; display:flex; align-items:center; justify-content:center; color:#fff;
  }
  @keyframes flow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 20px;
    padding: 44px 40px; text-align:center; max-width: 440px; width: 92%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  h1 { font-size:28px; font-weight:600; margin-bottom:6px; letter-spacing:1px; }
  .clock { font-size:13px; opacity:0.8; margin-bottom:14px; }
  .bio { font-size:15px; opacity:0.9; line-height:1.6; margin-bottom:18px; min-height:48px; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px; }
  .tags span {
    background: rgba(255,255,255,0.15); padding:5px 12px; border-radius:999px; font-size:12px;
  }
  .links a, .links button {
    display:block; width:100%; text-align:center; text-decoration:none; color:#fff;
    background: rgba(255,255,255,0.15); border:none; font:inherit; cursor:pointer;
    padding:13px; border-radius:12px; margin:10px 0; transition:0.2s; font-size:15px;
  }
  .links a:hover, .links button:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
  #qqmsg { min-height:20px; margin-top:6px; font-size:14px; font-weight:600; }
  footer { margin-top:24px; font-size:12px; opacity:0.6; }
  .links a, .links button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  @media (max-width:480px){
    .card { padding:30px 20px; }
    h1 { font-size:24px; }
    .links a, .links button { padding:12px; font-size:14px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>yzandwss</h1>
    <p class="clock" id="clock"></p>
    <p class="bio" id="typed"></p>
    <div class="tags">
      <span>Linux</span><span>Python</span><span>折腾</span><span>摄影</span><span>音乐</span>
    </div>
    <div class="links">
      <a href="about.html">关于我(未完工)</a>
      <a href="log.html">进入Ubuntu日志</a>
      <a href="https://wss.serveousercontent.com/bot-logs/" target="_blank" rel="noopener">进入bot日志</a>
      <a href="https://github.com/wss542/" target="_blank" rel="noopener">GitHub</a>
      <a href="https://b23.tv/9eUc2Oy" target="_blank" rel="noopener">哔哩哔哩</a>
      <button id="qqbtn" onclick="copyQQ()">点此复制QQ</button>
      <div id="qqmsg"></div>
    </div>
    <footer>用纯 HTML 搭建？ · Powered by Ubuntu</footer>
  </div>
  <script>
    function tick() {
      var d = new Date();
      var h = d.getHours();
      var greet = h < 6 ? '凌晨好' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
      var pad = function(n){ return n<10 ? '0'+n : n; };
      document.getElementById('clock').textContent = greet + ' · ' + pad(h) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    tick(); setInterval(tick, 1000);

    var text = '热爱折腾的音游玩家，在疯狂的搭建自己的小世界。';
    var i = 0;
    function type() {
      if (i <= text.length) {
        document.getElementById('typed').textContent = text.slice(0, i);
        i++;
        setTimeout(type, 70);
      }
    }
    type();

    function copyQQ() {
      var num = '3886438434';
      var msg = document.getElementById('qqmsg');
      var b = document.getElementById('qqbtn');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(num).then(function () {
          msg.textContent = '已复制 ✓';
          b.style.background = 'rgba(76,175,80,0.55)';
        }).catch(function () { fallbackCopy(num, msg, b); });
        return;
      }
      fallbackCopy(num, msg, b);
    }
    function fallbackCopy(num, msg, b) {
      var t = document.createElement('textarea');
      t.value = num; t.style.position = 'fixed'; t.style.top = '-1000px';
      document.body.appendChild(t); t.focus(); t.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(t);
      msg.textContent = ok ? '已复制 ✓' : '复制失败，请刷新重试';
      b.style.background = ok ? 'rgba(76,175,80,0.55)' : 'rgba(244,67,54,0.55)';
    }
  </script>
</body>
</html>
