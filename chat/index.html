<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>bot 私聊</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --glass: rgba(255,255,255,.08);
    --glass-strong: rgba(255,255,255,.14);
    --border: rgba(255,255,255,.18);
    --me: linear-gradient(135deg,#7b5cff,#a86bff);
    --bot: rgba(255,255,255,.10);
    --txt:#eef;
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--txt);
    background: linear-gradient(135deg,#1a1130,#241544,#102a3a,#1c1140);
    background-size:400% 400%;
    animation: flow 18s ease infinite;
    min-height:100vh; min-height:100dvh;
    overflow:hidden;
    -webkit-overflow-scrolling:touch;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);
  }
  @keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .rainbow-line{height:3px;border-radius:3px;background:linear-gradient(90deg,#ff5ca8,#ffd166,#5ce1e6,#a86bff);margin-bottom:10px;box-shadow:0 0 12px rgba(168,107,255,.6)}
  .app{
    display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 34px);
    max-width:560px;margin:0 auto;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:18px;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .bar{
    display:flex;align-items:center;gap:8px;padding:12px 16px;
    border-bottom:1px solid var(--border);background:rgba(255,255,255,.03);
    flex:0 0 auto;
  }
  .bar .dot{width:9px;height:9px;border-radius:50%;background:#5ce1e6;box-shadow:0 0 8px #5ce1e6}
  .bar .title{font-weight:600;letter-spacing:.5px}
  .bar .sub{font-size:11px;opacity:.55;margin-left:2px}
  .bar .mini{margin-left:auto;background:var(--glass-strong);border:1px solid var(--border);color:var(--txt);
    border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  .bar .mini:active{transform:scale(.96)}
  .msgs{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;max-width:100%}
  .row.me{justify-content:flex-end}
  .row.bot{justify-content:flex-start}
  .bubble{
    max-width:82%;padding:9px 13px;border-radius:14px;line-height:1.55;font-size:14px;white-space:pre-wrap;
    word-break:break-word;overflow-wrap:anywhere;
  }
  .row.me .bubble{background:var(--me);color:#fff;border-bottom-right-radius:4px}
  .row.bot .bubble{background:var(--bot);border:1px solid var(--border);border-bottom-left-radius:4px}
  .row.sys .bubble{background:transparent;color:#ff9;opacity:.8;font-size:12px;text-align:center;max-width:100%;margin:0 auto}
  .bubble .line{margin:3px 0;line-height:1.55}
  .bubble .act{color:#ffb86c;font-style:italic;opacity:.95}
  .bubble .act::before{content:"✦ "}
  .bubble .act::after{content:" ✦"}
  .bubble .thought{color:#9aa7ff;font-style:italic;opacity:.9}
  .bubble .thought::before{content:"💭 "}
  .mask[hidden]{display:none !important}
  #confirmmask{z-index:60;background:rgba(0,0,0,.5)}
  .cfmbox{background:#22223a;color:#eee;border:1px solid #4a4a6a;border-radius:14px;padding:18px 20px;max-width:92%;width:380px;box-shadow:0 12px 48px rgba(0,0,0,.55)}
  .cftitle{font-size:15px;font-weight:600;margin-bottom:10px;color:#ffd166}
  .cfdesc{font-size:13px;line-height:1.65;white-space:pre-wrap;margin-bottom:16px;opacity:.92}
  .cfbtns{display:flex;gap:10px;justify-content:flex-end}
  .cfbtns button{padding:7px 16px;border-radius:8px;border:1px solid #555;background:#33334d;color:#fff;cursor:pointer;font-size:13px}
  .cfbtns #cfyes{background:#e05260;border-color:#e05260}
  .cfbtns button:active{transform:scale(.97)}
  .inputrow{flex:0 0 auto;display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:rgba(255,255,255,.03)}
  .inputrow input{
    flex:1;background:var(--glass-strong);border:1px solid var(--border);color:var(--txt);
    border-radius:12px;padding:11px 14px;font-size:14px;outline:none;
  }
  .inputrow input::placeholder{color:rgba(255,255,255,.4)}
  .inputrow button{
    background:var(--me);border:none;color:#fff;font-weight:600;border-radius:12px;padding:0 18px;
    font-size:14px;cursor:pointer;
  }
  .inputrow button:disabled{opacity:.5;cursor:default}
  .offline{position:absolute;left:0;right:0;top:0;text-align:center;background:rgba(220,40,60,.92);color:#fff;
    font-size:12px;padding:6px;z-index:5}
  .offline[hidden]{display:none}
  /* 密码弹窗 */
  .mask{position:fixed;inset:0;background:rgba(10,8,20,.7);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
  .mask[hidden]{display:none}
  .pwbox{width:100%;max-width:320px;background:var(--glass-strong);border:1px solid var(--border);
    border-radius:16px;padding:22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .pwbox h3{font-size:16px;margin-bottom:14px;font-weight:600}
  .pwbox input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--txt);
    border-radius:10px;padding:11px;font-size:14px;outline:none;text-align:center}
  .pwbox button{width:100%;margin-top:14px;background:var(--me);border:none;color:#fff;font-weight:600;
    border-radius:10px;padding:11px;font-size:14px;cursor:pointer}
  .pwbox button.ghost{background:var(--glass-strong);margin-top:8px}
  .pwerr{color:#ff8080;font-size:12px;min-height:16px;margin-top:8px}
  .pwstatus{color:#9cf;font-size:11px;min-height:14px;margin-top:4px;opacity:.85}
  @media (max-width:480px){ .bubble{font-size:13px} .bar .title{font-size:15px} }
  /* ── 图片相关 ── */
  .bubble img.botimg, .bubble img.meimg{ max-width:100%; border-radius:10px; margin-top:6px; display:block; }
  .bubble img.meimg{ border:1px solid var(--border); }
  .inputrow .iconbtn{ background:var(--glass-strong); border:1px solid var(--border); color:var(--txt);
    border-radius:12px; padding:0 12px; font-size:18px; cursor:pointer; flex:0 0 auto; }
  .inputrow .iconbtn:active{ transform:scale(.96) }
  #imgprev{ display:none; gap:6px; padding:6px 10px; flex-wrap:wrap; border-top:1px solid var(--border);
    background:rgba(255,255,255,.03) }
  #imgprev .chip{ position:relative; line-height:0 }
  #imgprev img{ height:46px; border-radius:8px; border:1px solid var(--border) }
  #imgprev .x{ position:absolute; top:-6px; right:-6px; background:#e05260; color:#fff; border:none;
    border-radius:50%; width:18px; height:18px; font-size:11px; line-height:1; cursor:pointer; padding:0 }
</style>
</head>
<body>
<div id="devtools-blocker" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(8,6,20,.97);color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <div style="font-size:46px;margin-bottom:14px">🔒</div>
  <div style="font-size:19px;font-weight:700;margin-bottom:10px">已暂停访问</div>
  <div style="font-size:14px;color:#c9c9d6;line-height:1.7;max-width:330px">检测到开发者工具已打开。<br>为保护访问安全，本页面已停止响应。<br>请关闭开发者工具（F12）后<strong>刷新页面</strong>重新进入。</div>
</div>
<div class="rainbow-line"></div>
<div class="app" style="position:relative">
  <div id="offline" class="offline" hidden></div>
  <header class="bar">
    <span class="dot" id="dot"></span>
    <span class="title">bot 私聊</span>
    <span class="sub" id="sub">未连接</span>
    <button class="mini" id="clear">清空</button>
  </header>
  <div class="msgs" id="msgs"></div>
  <div id="imgprev"></div>
  <form class="inputrow" id="form">
    <button type="button" class="iconbtn" id="imgbtn" title="发送图片" disabled>📎</button>
    <input id="text" autocomplete="off" placeholder="和 bot 说点什么…" disabled>
    <button type="submit" id="send" disabled>发送</button>
  </form>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<div class="mask" id="pwmask">
  <div class="pwbox">
    <h3>🔒 需要密码</h3>
    <input id="pw" type="password" placeholder="输入聊天密码" autocomplete="off">
    <button id="pwok">进入</button>
    <button id="pwretry" class="ghost" hidden>立即重试</button>
    <div class="pwerr" id="pwerr"></div>
    <div class="pwstatus" id="pwstatus"></div>
  </div>
</div>

<div class="mask" id="confirmmask" hidden>
  <div class="cfmbox">
    <div class="cftitle">⚠️ 高危操作确认</div>
    <div class="cfdesc" id="cfdesc"></div>
    <div class="cfbtns">
      <button id="cfyes">确认执行</button>
      <button id="cfno" class="ghost">取消</button>
    </div>
  </div>
</div>

<script>
// ===== 开发者工具检测（挡普通用户；技术用户可绕过，真防护靠后端）=====
(function(){
  var blocked=false, bm=document.getElementById('devtools-blocker');
  // 是否为移动端（触屏/手机 UA）：手机没有 F12 式开发者工具，尺寸/计时检测在手机上
  // 会因软键盘弹起（innerHeight 骤减）或主线程繁忙而误判，故移动端整体跳过启发式检测。
  function isMobile(){
    return (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
           /Mobi|Android|iPhone|iPad|iPod|HarmonyOS|Windows Phone/i.test(navigator.userAgent);
  }
  var MOBILE = isMobile();
  window.__stopOnDevtools=function(){
    try{ if(typeof retryTimer!=='undefined' && retryTimer) clearInterval(retryTimer); }catch(e){}
    ['text','send','pw'].forEach(function(id){ var el=document.getElementById(id); if(el) el.disabled=true; });
  };
  function block(){
    if(blocked) return; blocked=true;
    if(bm) bm.style.display='flex';
    document.body.style.pointerEvents='none';
    try{ window.__stopOnDevtools(); }catch(e){}
  }
  window.addEventListener('keydown', function(e){
    if(MOBILE) return; // 移动端无键盘快捷键开 DevTools
    var k=(e.key||'').toLowerCase();
    if(e.key==='F12' || (e.ctrlKey&&e.shiftKey&&k==='i') ||
       (e.metaKey&&e.altKey&&(k==='i'||k==='j')) || (e.ctrlKey&&e.shiftKey&&k==='c')){
      e.preventDefault(); block();
    }
  });
  setInterval(function(){
    if(blocked || MOBILE) return;
    // 输入框聚焦（打字/输入法弹起）时不检测：避免输入法改变视口尺寸被误判
    var ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return;
    if(window.outerWidth-window.innerWidth>160 || window.outerHeight-window.innerHeight>160) block();
  }, 500);
  setInterval(function(){
    if(blocked || MOBILE) return;
    var t=performance.now(); debugger; if(performance.now()-t>100) block(); // 放宽到 100ms，避免慢设备误判
  }, 1000);
  window.__devtoolsBlocked=function(){ return blocked; };
})();

// ===== JS 令牌闸：每个请求必须带 time-window 的 sha256 令牌（禁用 JS / 裸 curl 拿不到 → 后端 403）=====
// 令牌 = sha256(SECRET + ":" + floor(epoch/30))，与服务端 _valid_token 同算法。
// 用浏览器标准 Web Crypto（https 上下文可用且权威正确），不手写哈希避免实现错误。
const TOKEN_SECRET = "hm_webchat_2026_fixed";
const TOKEN_WINDOW = 30; // 秒，与服务端一致
let _tokCache = { w: -1, v: null };
async function webToken(){
  const w = Math.floor(Date.now() / 1000 / TOKEN_WINDOW);
  if (_tokCache.w === w && _tokCache.v) return _tokCache.v;
  const data = TOKEN_SECRET + ":" + w;
  let hex;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
    hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    // 仅在非 https（本地 debug）时可能触发；生产环境均为 https，不会走到这
    console.error("webToken 计算失败（需 https 上下文）:", e);
    return "";
  }
  _tokCache = { w, v: hex };
  return hex;
}

const GHPAGES = "https://wss542.github.io";
const SERVEO = "https://wss.serveousercontent.com/chat/api";
// ENDPOINTS[0] 为首选通道（Cloudflare，若可用），serveo 作备用
let ENDPOINTS = [SERVEO];
let lastGood = null;          // 最近一次成功的通道，轮询时优先复用
let retryAttempts = 0;

// 每次（含重试）都重新拉取最新的 Cloudflare 地址（该地址会随隧道重启而轮换）
async function refreshEndpoints(){
  try{
    const r = await fetch(GHPAGES + "/chat/cf_url.txt", {cache:"no-store"});
    if(r.ok){
      const u = (await r.text()).trim().replace(/\/+$/, "");
      if(/^https?:\/\//.test(u)){
        ENDPOINTS = [u + "/chat/api", SERVEO];
        return;
      }
    }
  }catch(e){ /* 无备用通道则只用 serveo */ }
  ENDPOINTS = [SERVEO];
}

// 带超时+多次重试：依次尝试所有通道；成功时记录通道用于后续轮询
async function apiGet(params, retries=3, timeoutMs=10000){
  // JS 令牌闸：每个请求附 time-window 令牌（后端校验，禁用 JS / 裸 curl 会被 403）
  params = Object.assign({}, params, {token: await webToken()});
  let lastErr;
  for(const API of ENDPOINTS){
    for(let i=0;i<retries;i++){
      try{
        const url = API + "?" + new URLSearchParams(params).toString();
        const ctrl = new AbortController();
        const tid = setTimeout(()=>ctrl.abort(), timeoutMs);
        const r = await fetch(url, {method:"GET", signal:ctrl.signal, cache:"no-store"});
        clearTimeout(tid);
        const j = await r.json().catch(()=>({ok:false, error:"响应解析失败"}));
        if(j && typeof j.ok !== "undefined"){ lastGood = API; return j; }
        lastErr = new Error("bad-json:" + (j && j.error ? j.error : ""));
      }catch(e){ lastErr = e; await new Promise(res=>setTimeout(res, 400*(i+1))); }
    }
  }
  throw lastErr || new Error("network");
}
function resultApi(){ return (lastGood || ENDPOINTS[0] || SERVEO).replace("/chat/api", "/chat/result"); }

const sessionId = (crypto.randomUUID ? crypto.randomUUID() : "s"+Date.now()+Math.random().toString(16).slice(2));
let PASSWORD = sessionStorage.getItem("botchat_pw") || "";

const $ = s => document.querySelector(s);
const msgs = $("#msgs"), form = $("#form"), text = $("#text"), send = $("#send");
const offline = $("#offline"), dot = $("#dot"), sub = $("#sub");
const pwmask = $("#pwmask"), pw = $("#pw"), pwok = $("#pwok"), pwretry = $("#pwretry"),
      pwerr = $("#pwerr"), pwstatus = $("#pwstatus");

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// 把 bot 回复里的 <动作>/<心理> 标记渲染成花式样式（先转义防 XSS）
function renderBot(text){
  return String(text).split("\n").map(function(line){
    let h = escapeHtml(line);
    h = h.replace(/&lt;动作&gt;(.*?)&lt;\/动作&gt;/g, function(m,p){ return '<span class="act">'+p+'</span>'; });
    h = h.replace(/&lt;心理&gt;(.*?)&lt;\/心理&gt;/g, function(m,p){ return '<span class="thought">'+p+'</span>'; });
    return '<div class="line">'+h+'</div>';
  }).join("");
}

function addRow(role, content, imgLocal){
  const row = document.createElement("div");
  row.className = "row " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  if(role === "bot"){ b.innerHTML = renderBot(content); }
  else { b.textContent = content; }
  if(imgLocal){
    const im = document.createElement("img");
    im.className = "meimg";
    im.src = imgLocal;
    b.appendChild(im);
  }
  row.appendChild(b);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}
// 根据相对 URL 构建一个带令牌的图片元素（/chat/files 需要令牌才能访问）
async function imgEl(rel){
  try{
    const base = (lastGood || ENDPOINTS[0]).replace("/chat/api", "");
    const el = document.createElement("img");
    el.className = "botimg";
    el.loading = "lazy";
    el.alt = "图片";
    el.onerror = () => { el.alt = "图片加载失败"; };
    el.src = base + rel + "?token=" + await webToken();
    return el;
  }catch(e){ return null; }
}
function setConn(mode, txt){
  sub.textContent = txt;
  dot.style.background = mode==="live" ? "#5ce1e6" : mode==="warn" ? "#ffd166" : "#ff6b6b";
  dot.style.boxShadow = "0 0 8px " + dot.style.background;
}
function showOffline(msg){ offline.textContent = msg; offline.hidden = false; }
function hideOffline(){ offline.hidden = true; }

// 轮询结果（每次请求都很快，规避隧道对慢上游的硬超时）
async function pollResult(taskId, botRow){
  const bubble = botRow.querySelector(".bubble");
  for(let i=0; i<45; i++){
    try{
      const qr = new URLSearchParams({task_id:taskId});
      const r = await fetch(resultApi() + "?" + qr.toString(), {method:"GET"});
      const j = await r.json().catch(()=>({}));
      if(j && j.ok && j.ready){
        if(j.confirm){
          bubble.innerHTML = renderBot(j.reply || "");
          showConfirm(j.confirm, bubble);
        }else{
          bubble.innerHTML = renderBot(j.reply || "(空)");
        }
        // 渲染 bot 返回的图片（互发照片：bot → 用户）
        if(j.images && j.images.length){
          for(const rel of j.images){
            imgEl(rel).then(el => { if(el) bubble.appendChild(el); });
          }
        }
        hideOffline(); setConn("live","在线");
        return;
      }
      if(j && j.ok === false){
        bubble.textContent = "⚠️ " + (j.error || "出错了");
        return;
      }
    }catch(e){ /* 网络抖动，继续轮询 */ }
    await new Promise(res => setTimeout(res, 1500));
  }
  bubble.textContent = "⚠️ 等待超时，请重试";
}

async function sendMsg(content){
  if(!PASSWORD) return;
  // 取出待发送的图片（互发照片：用户 → bot）
  const rel = pendingRel, local = pendingLocal;
  pendingRel = null; pendingLocal = null; renderPrev();
  if(local){ addRow("me", content, local); }
  else { addRow("me", content); }
  send.disabled = true; text.disabled = true;
  try{
    const params = {session_id:sessionId, message:content, password:PASSWORD};
    if(rel) params.image = rel;
    const j = await apiGet(params);
    if(!j.ok){
      if(j.error && j.error.indexOf("密码")>=0){
        PASSWORD=""; sessionStorage.removeItem("botchat_pw");
        pwerr.textContent = "密码错误，请重新输入";
        pwmask.hidden = false; text.disabled = true; send.disabled = true;
        return;
      }
      addRow("sys", "⚠️ " + (j.error||"出错了"));
      return;
    }
    if(j.pending && j.task_id){
      const botRow = addRow("bot", "思考中… (｡•̀ᴗ-)✧");
      await pollResult(j.task_id, botRow);
    } else if(j.reply){
      hideOffline(); setConn("live","在线");
      addRow("bot", j.reply);
    }
  }catch(e){
    showOffline("⚠️ 网络异常，消息未发出（已恢复输入框，点发送可重试）");
    setConn("err","离线");
    addRow("sys","⚠️ 网络异常，请重试");
    text.value = content;            // 恢复内容，方便重发
  }finally{
    send.disabled = false; text.disabled = false; text.focus();
  }
}

// ── 图片上传（互发照片：用户发图）──
let pendingRel = null;   // 待发送的服务端相对 URL
let pendingLocal = null; // 待显示的本地预览 objectURL
function renderPrev(){
  const p = $("#imgprev"); p.innerHTML = "";
  if(pendingLocal){
    p.style.display = "flex";
    const chip = document.createElement("div"); chip.className = "chip";
    const im = document.createElement("img"); im.src = pendingLocal;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×";
    x.onclick = () => { pendingRel = null; pendingLocal = null; p.style.display = "none"; p.innerHTML = ""; };
    chip.append(im, x); p.append(chip);
  } else { p.style.display = "none"; }
}
// 上传前客户端压缩：移动端原图常 3-7MB，走隧道大体积 POST 易超时/连接重置（表现「Load failed」）。
// 缩放到最长边 1280、输出 JPEG 0.82，体积降到几百 KB，隧道稳定传输。
async function fileToCompressedB64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const MAX = 1280;
        if (w > MAX || h > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        // 透明 PNG 保留 png，其余走 jpeg（更小）
        const keepPng = /\.png$/i.test(file.name || "") || file.type === "image/png";
        const out = keepPng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.82);
        resolve(String(out).split(",")[1]);
      };
      img.onerror = () => reject(new Error("图片解码失败"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("读取失败"));
    reader.readAsDataURL(file);
  });
}
async function uploadImage(file){
  const b64 = await fileToCompressedB64(file);
  await refreshEndpoints();
  let lastErr;
  for(const API of ENDPOINTS){
    const base = API.replace("/chat/api", "");
    try{
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 40000);
      const r = await fetch(base + "/chat/upload", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          session_id: sessionId, password: PASSWORD,
          filename: file.name, data: b64, token: await webToken()
        }),
        signal: ctrl.signal
      });
      clearTimeout(t);
      const j = await r.json().catch(() => ({}));
      if(j && j.ok) return j;
      lastErr = new Error(j.error || "上传失败");
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("network");
}
$("#file").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  if(!PASSWORD){ pwerr.textContent = "请先进入聊天"; return; }
  try{
    const j = await uploadImage(f);
    pendingRel = j.url; pendingLocal = URL.createObjectURL(f);
    renderPrev();
  }catch(err){
    let msg = (err && err.message) ? err.message : "未知错误";
    if(err && err.name === "AbortError") msg = "上传超时，请重试";
    else if((msg||"").indexOf("Load") >= 0 || (msg||"").indexOf("Failed") >= 0 || (msg||"").indexOf("network") >= 0) msg = "网络错误，请检查连接后重试";
    addRow("sys", "⚠️ 图片上传失败：" + msg);
  }
});
$("#imgbtn").addEventListener("click", () => $("#file").click());

form.addEventListener("submit", e=>{
  e.preventDefault();
  const v = text.value.trim();
  if(!v && !pendingRel) return;
  text.value = "";
  sendMsg(v);
});

$("#clear").addEventListener("click", ()=>{ msgs.innerHTML=""; addRow("sys","已清空本窗口（远端记忆仍在）"); });

// ---- 解锁 + 后台自动重连（带手动重试按钮 + 状态） ----
let retryTimer = null;
function stopRetry(){ if(retryTimer){ clearInterval(retryTimer); retryTimer = null; } }

async function doUnlock(pwVal){
  const j = await apiGet({session_id:sessionId, message:"__ping__", password:pwVal});
  if(j.ok) return j;                                      // 可能带 token / left（访客密码）
  if(j.error && j.error.indexOf("密码")>=0) return {bad:true, error:j.error};
  throw new Error("connect");
}
function enterChat(pwVal, j){
  stopRetry();
  retryAttempts = 0;
  // 访客密码：服务端发放 24h 令牌，之后聊天全用令牌（刷新页面不重复扣次数）
  PASSWORD = (j && j.token) ? j.token : pwVal;
  sessionStorage.setItem("botchat_pw", PASSWORD);
  pwmask.hidden = true; pwretry.hidden = true;
  text.disabled=false; send.disabled=false; $("#imgbtn").disabled=false; text.focus();
  setConn("live","在线");
  addRow("sys","已连接 · 和 bot 聊天吧 (｡･ω･｡)");
  if(j && typeof j.left !== "undefined"){
    addRow("sys","🎫 访客密码剩余 " + j.left + " 次（本次登录 24 小时内有效）");
  }
}
function startRetry(pwVal){
  if(retryTimer) return;
  retryTimer = setInterval(async ()=>{
    try{
      retryAttempts++;
      pwstatus.textContent = "正在自动重试（第 " + retryAttempts + " 次）…";
      await refreshEndpoints();           // 每次重试都拉最新地址
      const j = await doUnlock(pwVal);
      if(j && !j.bad){ enterChat(pwVal, j); }
      else if(j && j.bad){ stopRetry(); pwstatus.textContent=""; pwerr.textContent = j.error || "密码错误"; }
    }catch(e){
      const why = (e && e.name==="AbortError") ? "请求超时" : "网络不可达";
      pwstatus.textContent = "第 " + retryAttempts + " 次失败（" + why + "），继续重试…";
    }
  }, 5000);
}
async function tryUnlock(pwVal, silent){
  if(!silent) pwerr.textContent = "连接中…";
  pwstatus.textContent = "";
  pwretry.hidden = true;
  try{
    await refreshEndpoints();
    const j = await doUnlock(pwVal);
    if(j && !j.bad){ enterChat(pwVal, j); return; }
    pwerr.textContent = (j && j.error) || "密码错误";
  }catch(e){
    const why = (e && e.name==="AbortError") ? "请求超时" : "网络不可达";
    pwerr.textContent = "连接失败（" + why + "）";
    pwstatus.textContent = "正在自动重试（第 1 次）…";
    pwretry.hidden = false;
    retryAttempts = 1;
    startRetry(pwVal);
  }
}
pwok.addEventListener("click", ()=> tryUnlock(pw.value, false));
pw.addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(pw.value, false); });
pwretry.addEventListener("click", ()=>{ stopRetry(); retryAttempts = 0; tryUnlock(pw.value, false); });

// 初始：若已保存密码则预填，但仍需点"进入"才连接（避免"未输密码就在连"的困惑）
if(PASSWORD){ pw.value = PASSWORD; }
pwmask.hidden = false;

// ---- 高危命令二次确认（主密码触发高危写操作命令时弹窗） ----
let pendingConfirmCmd = null, pendingBubble = null;
function showConfirm(c, bubble){
  pendingConfirmCmd = c.command;
  pendingBubble = bubble;
  $("#cfdesc").textContent = c.desc + "\n命令：" + c.command;
  $("#confirmmask").hidden = false;
}
$("#cfyes").addEventListener("click", async ()=>{
  const cmd = pendingConfirmCmd;
  $("#confirmmask").hidden = true;
  pendingConfirmCmd = null;
  if(cmd) await sendConfirm(cmd);
});
$("#cfno").addEventListener("click", ()=>{
  $("#confirmmask").hidden = true;
  if(pendingBubble) pendingBubble.innerHTML = renderBot("（已取消该操作）");
  pendingConfirmCmd = null; pendingBubble = null;
});
async function sendConfirm(cmd){
  addRow("me", cmd);
  const row = addRow("bot", "执行中…");
  try{
    const j = await apiGet({session_id:sessionId, message:cmd, password:PASSWORD, confirm:1});
    if(!j.ok){
      row.querySelector(".bubble").innerHTML = "⚠️ " + (j.error || "失败");
      return;
    }
    if(j.pending && j.task_id) await pollResult(j.task_id, row);
    else if(j.reply) row.querySelector(".bubble").innerHTML = renderBot(j.reply);
  }catch(e){
    row.querySelector(".bubble").innerHTML = "⚠️ 连接失败";
  }
}
